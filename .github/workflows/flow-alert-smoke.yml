name: Overlap flow and completion alarm smoke
on:
  push:
    branches: [feature/overlap-flow-alert-v1]
  workflow_dispatch:
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
        working-directory: mujoco_cad_preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install numeric runtime
        run: python -m pip install 'mujoco==3.17.0' 'numpy<3' 'scipy<2'
      - name: Compile and validate interpolation and guards
        run: |
          python -m py_compile flow_trial.py flow_lab.py flow_notify.py
          python - <<'PY'
          import numpy as np
          from flow_trial import hermite5,valid,DEFAULT
          from flow_lab import comparison
          p0=np.array([0.,1.,2.]);p1=np.array([1.,3.,2.]);v0=np.array([.1,.2,0.]);v1=np.array([.2,-.1,0.]);T=2.
          assert np.allclose(hermite5(p0,p1,v0,v1,T,0),p0)
          assert np.allclose(hermite5(p0,p1,v0,v1,T,1),p1)
          h=1e-5
          assert np.allclose((hermite5(p0,p1,v0,v1,T,h)-p0)/(T*h),v0,atol=1e-6)
          assert np.allclose((p1-hermite5(p0,p1,v0,v1,T,1-h))/(T*h),v1,atol=1e-6)
          assert comparison({'passed':False},{'passed':True}) is None
          try: valid(dict(DEFAULT,slot_s=.01))
          except ValueError: pass
          else: raise AssertionError('Unsafe duration accepted')
          PY
      - name: Test alarm persistence and mocked Windows API calls
        run: |
          python - <<'PY'
          import os,tempfile,pathlib,types
          from unittest.mock import patch,Mock
          from flow_notify import notify
          with tempfile.TemporaryDirectory() as tmp:
              p=pathlib.Path(tmp)
              r=notify(p,'NO_CONTINUITY_IMPROVEMENT',silent=True)
              assert r['status']=='NO_CONTINUITY_IMPROVEMENT' and (p/'notification.json').is_file()
              if os.name=='nt':
                  box=Mock(return_value=1)
                  with patch('winsound.Beep') as sound,patch('ctypes.WinDLL',return_value=types.SimpleNamespace(MessageBoxW=box)):
                      r=notify(p,'CONFIRMED_FLOW_SAVED')
                      assert sound.call_count==3 and box.call_count==1
                      assert r['dialog']=='acknowledged'
          print('Notification dispatch verified with mocks. This does not prove audible sound on the user PC.')
          PY
      - name: Detached supervisor, rejected-source gate, saved completion notification
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,sys,time
          source=pathlib.Path('invalid_flow_test.xml');source.write_text('<mujoco/>')
          subprocess.run([sys.executable,'flow_lab.py','--start','--hours','.05','--workers','2','--trials','0',
              '--commands','forward,backward','--source',str(source),'--no-alert'],check=True)
          run=pathlib.Path(pathlib.Path('output/flow_lab/LATEST.txt').read_text().strip())
          deadline=time.monotonic()+70
          while time.monotonic()<deadline:
              if (run/'notification.json').exists(): break
              time.sleep(.5)
          else:
              (run/'STOP').write_text('CI timeout')
              raise AssertionError('No completion notification record')
          s=json.loads((run/'status.json').read_text())
          assert s['state']=='BASELINE_FAILED_NO_SEARCH',s
          assert s['active']==[]
          assert (run/'results_bundle.zip').is_file()
          assert json.loads((run/'completion.json').read_text())['state']==s['state']
          assert json.loads((run/'notification.json').read_text())['status']==s['state']
          print('PASS: rejected invalid source without search, detached exit, archive, notification status')
          print('This workflow is a runtime/control-flow check, not actual CAD locomotion validation.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-alert-smoke-${{ matrix.os }}
          path: |
            mujoco_cad_preview/output/flow_lab/*/status.json
            mujoco_cad_preview/output/flow_lab/*/completion.json
            mujoco_cad_preview/output/flow_lab/*/notification.json
            mujoco_cad_preview/output/flow_lab/*/master.log
