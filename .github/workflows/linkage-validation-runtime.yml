name: Linkage validation runtime
on:
  push:
    branches: [feature/linkage-baseline-v1]
    paths: [.github/workflows/linkage-validation-runtime.yml]
  workflow_dispatch:
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download official runtime wheels for offline private-CAD validation
        run: |
          python -m pip download --only-binary=:all: --dest wheels mujoco==3.17.0
      - uses: actions/upload-artifact@v4
        with:
          name: mujoco-validation-cp313-linux
          retention-days: 1
          path: wheels/*.whl
